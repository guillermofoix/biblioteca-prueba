# Despliegue con la base de datos en RDS (PostgreSQL gestionado por AWS).
# Uso: docker compose -f docker-compose.rds.yml up -d --build
# No hay servicio "db": la base de datos ya no es un contenedor, la gestiona AWS.
# Por eso tampoco hacen falta volumen, healthcheck ni depends_on.
services:

  # La imagen de la app es exactamente la misma (mismo Dockerfile);
  # lo único que cambia es DATABASE_URL, que ahora apunta a RDS.
  app:
    build: .
    restart: unless-stopped
    # Solo escucha en 127.0.0.1 de la EC2; se accede mediante túnel SSH:
    #   ssh -L 5000:localhost:5000 usuario@IP-de-la-EC2
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      # ${VAR:?mensaje} -> variable obligatoria: si falta en .env, Compose se detiene y muestra el mensaje.
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL con la conexión a RDS en .env}
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en .env}
